<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08080a">
<title>UMS — User Managed Storage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #08080a;
  --bg-1: #0f0f12;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-elevated: rgba(255, 255, 255, 0.06);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.12);
  --text-1: #f5f5f7;
  --text-2: rgba(255, 255, 255, 0.5);
  --text-3: rgba(255, 255, 255, 0.3);
  --accent: #FF2D55;
  --accent-2: #ff9558;
  --accent-soft: rgba(255, 45, 85, 0.15);
  --shadow-float: 0 30px 60px rgba(0, 0, 0, 0.5);
  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

html, body { 
  height: 100%; 
  background: var(--bg-0); 
  color: var(--text-1); 
  font-family: 'Manrope', system-ui, -apple-system, sans-serif; 
  -webkit-font-smoothing: antialiased; 
  overflow-x: hidden; 
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; width: 100%; }

/* Ambient Mesh Gradient Background */
.ambient { 
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; 
  background: radial-gradient(circle at 0% 0%, rgba(255, 45, 85, 0.08), transparent 40%), 
              radial-gradient(circle at 100% 100%, rgba(94, 181, 255, 0.05), transparent 40%); 
}

.app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 48px 64px 100px; }

/* Topbar */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 80px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand-logo { 
  width: 48px; height: 48px; 
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); 
  border-radius: 14px; display: flex; align-items: center; justify-content: center; 
  box-shadow: 0 12px 24px rgba(255, 45, 85, 0.3); 
}
.brand-logo i { width: 26px; height: 26px; color: #FFF; }
.brand-text { display: flex; flex-direction: column; }
.brand-title { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.brand-sub { font-size: 14px; color: var(--text-2); font-weight: 500; margin-top: 4px; letter-spacing: 0.02em; }

.btn-primary { 
  display: inline-flex; align-items: center; gap: 10px; 
  padding: 16px 32px; background: #FFF; color: #000; 
  border-radius: var(--radius-pill); font-size: 16px; font-weight: 700; 
  transition: all 0.3s var(--ease-out); 
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(255,255,255,0.15); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary i { width: 20px; height: 20px; }

/* Stats Bar */
.stats-bar { display: flex; gap: 24px; margin-bottom: 64px; }
.stat-card { flex: 1; }
.stat-value { font-size: 56px; font-weight: 300; letter-spacing: -0.04em; margin-bottom: 8px; line-height: 1; }
.stat-label { font-size: 14px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }

/* File Grid */
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 32px; }

.file-card { 
  background: var(--bg-card); backdrop-filter: blur(20px); 
  border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 40px; 
  transition: all 0.4s var(--ease-out); opacity: 0; transform: translateY(20px); 
  animation: revealCard 0.6s var(--ease-out) forwards; 
}
@keyframes revealCard { to { opacity: 1; transform: translateY(0); } }
.file-card:hover { 
  background: var(--bg-elevated); border-color: var(--glass-highlight); 
  transform: translateY(-6px); box-shadow: var(--shadow-float); 
}

.file-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 32px; }
.file-icon { 
  width: 64px; height: 64px; border-radius: 18px; 
  background: var(--accent-soft); color: var(--accent); 
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; 
}
.file-icon.img { background: rgba(94, 181, 255, 0.15); color: #5eb5ff; }
.file-icon.vid { background: rgba(255, 149, 88, 0.15); color: var(--accent-2); }
.file-icon i { width: 32px; height: 32px; }
.file-meta-head { flex: 1; min-width: 0; padding-top: 4px; }
.file-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
.file-name { font-size: 14px; color: var(--text-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.file-desc { font-size: 15px; color: var(--text-2); line-height: 1.6; margin-bottom: 32px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 48px; }

.file-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid var(--glass-border); }
.file-info { font-size: 13px; color: var(--text-3); font-weight: 600; }
.file-actions { display: flex; gap: 8px; }
.file-btn { 
  width: 40px; height: 40px; border-radius: 12px; 
  display: flex; align-items: center; justify-content: center; 
  color: var(--text-2); transition: all 0.2s var(--ease-out); 
}
.file-btn:hover { background: var(--glass-bg); color: #FFF; transform: scale(1.05); }
.file-btn.delete:hover { background: var(--accent-soft); color: var(--accent); }
.file-btn i { width: 18px; height: 18px; }

/* Empty State */
.empty-state { 
  grid-column: 1 / -1; text-align: center; padding: 120px 40px; 
  background: var(--bg-card); border: 1px solid var(--glass-border); 
  border-radius: var(--radius-xl); 
}
.empty-state i { width: 80px; height: 80px; color: var(--text-3); margin: 0 auto 32px; display: block; opacity: 0.5; }
.empty-state h3 { font-size: 28px; font-weight: 300; letter-spacing: -0.02em; margin-bottom: 12px; color: var(--text-1); }
.empty-state p { color: var(--text-2); font-size: 16px; max-width: 400px; margin: 0 auto; line-height: 1.5; }

/* Modal */
.modal-overlay { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
  backdrop-filter: blur(20px); z-index: 100; display: flex; 
  align-items: center; justify-content: center; padding: 24px; 
  opacity: 0; visibility: hidden; transition: all 0.3s var(--ease-out); 
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal { 
  background: var(--bg-1); border: 1px solid var(--glass-highlight); 
  border-radius: var(--radius-xl); width: 100%; max-width: 640px; padding: 48px; 
  box-shadow: var(--shadow-float); transform: scale(0.95) translateY(20px); 
  transition: transform 0.4s var(--ease-spring); 
}
.modal-overlay.active .modal { transform: scale(1) translateY(0); }

.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
.modal-title { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
.modal-close { 
  width: 44px; height: 44px; border-radius: 50%; background: var(--glass-bg); 
  display: flex; align-items: center; justify-content: center; transition: all 0.3s; 
}
.modal-close:hover { background: var(--accent-soft); color: var(--accent); transform: rotate(90deg); }
.modal-close i { width: 22px; height: 22px; }

.drop-zone { 
  border: 2px dashed var(--glass-highlight); border-radius: var(--radius-lg); 
  padding: 48px 24px; text-align: center; margin-bottom: 32px; cursor: pointer; transition: all 0.3s; 
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
.drop-zone i { width: 48px; height: 48px; color: var(--text-2); margin: 0 auto 16px; display: block; transition: color 0.3s; }
.drop-zone:hover i { color: var(--accent); }
.drop-zone h4 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.drop-zone p { font-size: 14px; color: var(--text-3); }
.drop-zone .file-name-display { color: var(--accent); font-weight: 700; }

.input-group { margin-bottom: 24px; }
.input-label { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; display: block; }
.input-field { 
  width: 100%; padding: 18px; background: var(--bg-0); 
  border-radius: var(--radius-md); font-size: 16px; font-weight: 500; 
  border: 1px solid transparent; transition: border 0.2s; 
}
.input-field:focus { border-color: var(--accent); }
textarea.input-field { min-height: 120px; resize: vertical; line-height: 1.5; }

/* Speed Meter */
.speed-meter { background: var(--bg-0); border-radius: var(--radius-md); padding: 24px; margin-top: 24px; display: none; }
.speed-meter.active { display: block; }
.meter-top { display: flex; justify-content: space-between; margin-bottom: 16px; }
.meter-status { font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.meter-status i { animation: spin 1s linear infinite; }
.meter-speed { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.progress-track { height: 8px; background: var(--bg-card); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width 0.2s linear; border-radius: 999px; }

/* Download Indicator (Floating) */
.dl-toast { 
  position: fixed; bottom: 40px; right: 40px; background: var(--bg-1); 
  border: 1px solid var(--glass-highlight); border-radius: var(--radius-lg); 
  padding: 24px; width: 320px; box-shadow: var(--shadow-float); z-index: 150; 
  transform: translateX(400px); transition: transform 0.4s var(--ease-spring); 
}
.dl-toast.active { transform: translateX(0); }
.dl-head { display: flex; justify-content: space-between; margin-bottom: 16px; }
.dl-title { font-size: 14px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
.dl-speed { font-size: 14px; font-weight: 700; color: var(--accent); }

/* Toast */
.toast { 
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); 
  padding: 16px 32px; background: #FFF; color: #000; border-radius: var(--radius-pill); 
  font-size: 15px; font-weight: 700; z-index: 200; opacity: 0; transition: all 0.4s var(--ease-spring); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); white-space: nowrap; 
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.loading-spinner { 
  width: 48px; height: 48px; border: 4px solid var(--glass-border); 
  border-top-color: var(--accent); border-radius: 50%; 
  animation: spin 1s linear infinite; margin: 120px auto; grid-column: 1 / -1; 
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Mobile adjustments */
@media (max-width: 768px) {
  .app { padding: 24px 24px 60px; }
  .topbar { margin-bottom: 40px; flex-direction: column; gap: 24px; align-items: flex-start; }
  .brand-title { font-size: 24px; }
  .brand-sub { display: none; }
  .stats-bar { flex-direction: row; gap: 32px; margin-bottom: 40px; }
  .stat-value { font-size: 36px; }
  .file-grid { grid-template-columns: 1fr; gap: 24px; }
  .file-card { padding: 28px; }
  .modal { padding: 32px 24px; }
  .modal-title { font-size: 24px; }
  .dl-toast { right: 20px; left: 20px; width: auto; bottom: 20px; }
}
</style>
</head>
<body>

<div class="ambient"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><i data-lucide="database"></i></div>
      <div class="brand-text">
        <div class="brand-title">UMS</div>
        <div class="brand-sub">User Managed Storage</div>
      </div>
    </div>
    <button class="btn-primary" onclick="openModal()">
      <i data-lucide="upload-cloud"></i> Upload File
    </button>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-value" id="totalFiles">0</div>
      <div class="stat-label">Files Stored</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalSize">0 B</div>
      <div class="stat-label">Cloud Storage Used</div>
    </div>
  </div>

  <div class="file-grid" id="fileGrid">
    <div class="loading-spinner"></div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-head">
      <h2 class="modal-title">Upload to Cloud</h2>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <i data-lucide="cloud-upload"></i>
      <h4 id="dropTitle">Choose a file to upload</h4>
      <p id="dropSub">Or drag and drop it here</p>
      <input type="file" id="fileInput" style="display:none;">
    </div>

    <div class="input-group">
      <label class="input-label">File Title</label>
      <input type="text" class="input-field" id="metaTitle" placeholder="e.g., Q3 Financial Report">
    </div>

    <div class="input-group">
      <label class="input-label">Description / Metadata</label>
      <textarea class="input-field" id="metaDesc" placeholder="Add a description, tags, or notes about this file..."></textarea>
    </div>

    <div class="speed-meter" id="speedMeter">
      <div class="meter-top">
        <div class="meter-status"><i data-lucide="loader-2"></i> Uploading...</div>
        <div class="meter-speed" id="meterSpeed">0 MB/s</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <button class="btn-primary" style="width: 100%; justify-content: center; margin-top: 32px;" id="submitBtn" onclick="uploadFile()">
      <i data-lucide="check-circle"></i> Save to Cloud
    </button>
  </div>
</div>

<!-- Download Floating Indicator -->
<div class="dl-toast" id="dlToast">
  <div class="dl-head">
    <div class="dl-title" id="dlTitle">Downloading...</div>
    <div class="dl-speed" id="dlSpeed">0 MB/s</div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="dlProgress" style="background: var(--accent);"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Auto-detect if running locally or on Render
const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === '192.168.100.2') 
  ? `http://${window.location.hostname}:8000` 
  : 'https://umx-music.onrender.com';

let selectedFile = null;

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toast._timer); toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024; const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return { class: 'img', icon: 'image' };
  if (['mp4', 'mov', 'avi', 'mkv'].includes(ext)) return { class: 'vid', icon: 'video' };
  return { class: 'doc', icon: 'file-text' };
}

// Modal Logic
function openModal() { document.getElementById('uploadModal').classList.add('active'); }
function closeModal() {
  document.getElementById('uploadModal').classList.remove('active');
  selectedFile = null;
  document.getElementById('metaTitle').value = '';
  document.getElementById('metaDesc').value = '';
  document.getElementById('dropTitle').innerText = 'Choose a file to upload';
  document.getElementById('dropSub').innerText = 'Or drag and drop it here';
  document.getElementById('speedMeter').classList.remove('active');
}

// File Selection
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', ev => handleFile(ev.dataTransfer.files[0]));
fileInput.addEventListener('change', ev => handleFile(ev.target.files[0]));

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  document.getElementById('dropTitle').innerHTML = `<span class="file-name-display">${file.name}</span>`;
  document.getElementById('dropSub').innerText = `${formatBytes(file.size)} • Click to change`;
  if (!document.getElementById('metaTitle').value) {
    document.getElementById('metaTitle').value = file.name.replace(/\.[^/.]+$/, "");
  }
}

// Upload Logic with Speed Meter
async function uploadFile() {
  if (!selectedFile) return showToast('Please select a file first.');
  
  const title = document.getElementById('metaTitle').value || selectedFile.name;
  const description = document.getElementById('metaDesc').value;
  
  const formData = new FormData();
  formData.append('file', selectedFile);
  formData.append('title', title);
  formData.append('description', description);

  const speedMeter = document.getElementById('speedMeter');
  const progressFill = document.getElementById('progressFill');
  const meterSpeed = document.getElementById('meterSpeed');
  const submitBtn = document.getElementById('submitBtn');
  
  speedMeter.classList.add('active');
  submitBtn.innerHTML = '<i data-lucide="loader-2" style="animation: spin 1s linear infinite;"></i> Uploading...';
  lucide.createIcons();

  // Using XMLHttpRequest to track upload progress
  const xhr = new XMLHttpRequest();
  let startTime = Date.now();

  xhr.upload.addEventListener('progress', (e) => {
    if (e.lengthComputable) {
      const percent = (e.loaded / e.total) * 100;
      progressFill.style.width = percent + '%';
      
      const elapsedSeconds = (Date.now() - startTime) / 1000;
      const speed = e.loaded / elapsedSeconds; // bytes per second
      meterSpeed.innerText = `${(speed / 1024 / 1024).toFixed(2)} MB/s`;
    }
  });

  xhr.onload = function() {
    if (xhr.status === 200) {
      showToast('File uploaded successfully!');
      closeModal();
      fetchFiles();
    } else {
      showToast('Upload failed.');
    }
    submitBtn.innerHTML = '<i data-lucide="check-circle"></i> Save to Cloud';
    lucide.createIcons();
  };

  xhr.onerror = function() {
    showToast('Network error.');
    submitBtn.innerHTML = '<i data-lucide="check-circle"></i> Save to Cloud';
    lucide.createIcons();
  };

  xhr.open('POST', `${API_BASE}/api/upload`, true);
  xhr.send(formData);
}

// Fetch & Render Files
async function fetchFiles() {
  const grid = document.getElementById('fileGrid');
  grid.innerHTML = '<div class="loading-spinner"></div>';
  try {
    const res = await fetch(`${API_BASE}/api/files`);
    if (!res.ok) throw new Error("Backend offline");
    const data = await res.json();
    
    document.getElementById('totalFiles').textContent = data.length;
    const totalSize = data.reduce((sum, f) => sum + f.size, 0);
    document.getElementById('totalSize').textContent = formatBytes(totalSize);
    
    if (data.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i data-lucide="cloud-off"></i>
          <h3>Your Cloud is Empty</h3>
          <p>Click "Upload File" to add your first file. It's stored securely and privately.</p>
        </div>
      `;
    } else {
      grid.innerHTML = data.map((f, i) => {
        const icon = getFileIcon(f.name);
        return `
          <div class="file-card" style="animation-delay: ${i * 0.08}s">
            <div class="file-head">
              <div class="file-icon ${icon.class}"><i data-lucide="${icon.icon}"></i></div>
              <div class="file-meta-head">
                <div class="file-title">${f.title}</div>
                <div class="file-name">${f.name}</div>
              </div>
            </div>
            <div class="file-desc">${f.description || 'No description provided.'}</div>
            <div class="file-footer">
              <div class="file-info">${formatBytes(f.size)}</div>
              <div class="file-actions">
                <button class="file-btn" onclick="copyLink('${f.id}')" title="Copy Link"><i data-lucide="link"></i></button>
                <button class="file-btn" onclick="initiateDownload('${f.id}', '${f.name}')" title="Download"><i data-lucide="download"></i></button>
                <button class="file-btn delete" onclick="deleteFile('${f.id}')" title="Delete"><i data-lucide="trash-2"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    lucide.createIcons();
  } catch (e) { 
    grid.innerHTML = `<div class="empty-state"><i data-lucide="wifi-off"></i><h3>Connection Error</h3><p>Could not connect to the UMS backend at ${API_BASE}.</p></div>`;
    lucide.createIcons();
  }
}

// Download Logic with Speed Meter
async function initiateDownload(id, filename) {
  const dlToast = document.getElementById('dlToast');
  const dlProgress = document.getElementById('dlProgress');
  const dlSpeed = document.getElementById('dlSpeed');
  const dlTitle = document.getElementById('dlTitle');
  
  dlTitle.innerText = filename;
  dlToast.classList.add('active');
  dlProgress.style.width = '0%';
  dlSpeed.innerText = '0 MB/s';

  try {
    const res = await fetch(`${API_BASE}/api/download/${id}`);
    if (!res.ok) throw new Error('Download failed');

    const total = parseFloat(res.headers.get('content-length') || 0);
    const reader = res.body.getReader();
    let received = 0;
    let chunks = [];
    let startTime = Date.now();

    while(true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      
      if (total > 0) {
        const percent = (received / total) * 100;
        dlProgress.style.width = percent + '%';
      }
      
      const elapsedSeconds = (Date.now() - startTime) / 1000;
      const speed = received / elapsedSeconds;
      dlSpeed.innerText = `${(speed / 1024 / 1024).toFixed(2)} MB/s`;
    }

    const blob = new Blob(chunks);
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    
    showToast('Download complete!');
  } catch (e) {
    showToast('Download failed.');
  } finally {
    setTimeout(() => dlToast.classList.remove('active'), 2000);
  }
}

async function copyLink(id) {
  const link = `${API_BASE}/api/download/${id}`;
  navigator.clipboard.writeText(link);
  showToast('Shareable link copied to clipboard!');
}

async function deleteFile(id) {
  if (!confirm('Delete this file permanently?')) return;
  try {
    await fetch(`${API_BASE}/api/delete/${id}`, { method: 'DELETE' });
    showToast('File deleted.');
    fetchFiles();
  } catch (e) { showToast('Failed to delete'); }
}

// Close modal on outside click
document.getElementById('uploadModal').addEventListener('click', (e) => {
  if (e.target.id === 'uploadModal') closeModal();
});

// Init
lucide.createIcons();
fetchFiles();
</script>
</body>
